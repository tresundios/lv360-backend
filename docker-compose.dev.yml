services:
  backend:
    image: navistresundios/lamviec360-backend:dev-latest
    container_name: lv360_backend_dev
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:lv360_dev_password@postgres:5432/lv360
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_jwt_secret_key_change_in_production
      - CORS_ORIGINS=https://appdev.lamviec360.com,https://dev.lamviec360.com
      - POSTGRES_DB=lv360
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=lv360_dev_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lv360-shared-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    container_name: lv360_postgres_dev
    restart: always
    environment:
      - POSTGRES_DB=lv360
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=lv360_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lv360-shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: lv360_redis_dev
    restart: always
    ports:
      - "6379:6379"
    networks:
      - lv360-shared-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  pg-backup:
    image: postgres:15-alpine
    container_name: lv360_pg_backup_dev
    restart: always
    environment:
      - PGPASSWORD=lv360_dev_password
    volumes:
      - ./backups:/backups
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lv360-shared-network
    command: >
      sh -c "
      while true; do
        pg_dump -h postgres -U postgres lv360 > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql
        find /backups -name '*.sql' -mtime +30 -delete
        sleep 86400
      done
      "
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: false

networks:
  lv360-shared-network:
    external: true
